services:
  - type: web
    name: aetheron-cloud-api
    runtime: python
    plan: free
    rootDir: apps/cloud-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: AETHERON_LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AETHERON_MODEL
        value: openai/gpt-oss-20b
      - key: AETHERON_ALLOWED_ORIGINS
        value: http://localhost:3000,https://tanvirsparklegifts.github.io
      - key: AETHERON_CHAT_RPM_PER_IP
        value: "10"
